<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../assets/css/site.css">
<style>html,body{width:1200px;height:630px;overflow:hidden;background:var(--paper)} .og{display:grid;grid-template-columns:520px 1fr;gap:36px;padding:40px 44px 0;height:590px}
.og h1{font-size:54px} .og p{margin-top:20px;font-size:22px;color:var(--ink-2)} .og .id{display:flex;gap:12px;align-items:center;font:600 16px Archivo;font-stretch:112%;letter-spacing:.06em;text-transform:uppercase;margin-bottom:28px}
.og .id img{width:40px;height:40px} .og .fig{height:100%} .og .fig img{height:100%;object-fit:cover} .og .tag{margin-top:26px;display:inline-block;background:var(--spot);border:2px solid var(--ink);padding:10px 16px;font:750 18px Archivo;font-stretch:118%;text-transform:uppercase}
.b{position:absolute;left:0;right:0;bottom:0;height:22px;background:var(--ink)} .b .band{height:4px;animation:none}</style></head>
<body><div class="og"><div><div class="id"><img src="../assets/img/icon-64.png" alt="">Black Hole Wallpaper</div><h1>Your desktop, bent by a black hole.</h1><p>Real light bending, live on your Mac desktop. Free and open source.</p><span class="tag">macOS 15+ / MIT</span></div>
<figure class="fig"><img src="../assets/img/hero-still.jpg" alt=""></figure></div><div class="b"><div class="band"></div></div></body></html>
